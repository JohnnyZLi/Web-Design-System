name: One-time clip reveal visual

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-and-render:
    if: github.head_ref == 'agent/clip-reveal-attached-menus' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/clip-reveal-attached-menus
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Replace overlapping motion with downward clip reveal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('styles/site-identity.css')
          css = css_path.read_text()
          old = '''@media (prefers-reduced-motion: no-preference) {
          .jl-site-menu:not([hidden]),
          .jl-settings-menu:not([hidden]) {
            transform-origin: top center;
            animation: jl-attached-menu-lower 190ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
          }
        }

        @keyframes jl-attached-menu-lower {
          from {
            opacity: 0;
            transform: translateY(-7px) scaleY(0.97);
          }

          to {
            opacity: 1;
            transform: translateY(0) scaleY(1);
          }
        }
        '''
          new = '''@media (prefers-reduced-motion: no-preference) {
          .jl-site-menu:not([hidden]),
          .jl-settings-menu:not([hidden]) {
            animation: jl-attached-menu-reveal 190ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
          }
        }

        @keyframes jl-attached-menu-reveal {
          from {
            opacity: 0;
            clip-path: inset(0 0 100% 0);
          }

          to {
            opacity: 1;
            clip-path: inset(0);
          }
        }
        '''
          old = '\n'.join(line[8:] if line.startswith('        ') else line for line in old.splitlines()) + '\n'
          new = '\n'.join(line[8:] if line.startswith('        ') else line for line in new.splitlines()) + '\n'
          if old not in css:
              raise SystemExit('Expected attached-menu animation block was not found')
          css_path.write_text(css.replace(old, new, 1))

          contract_path = Path('scripts/validate_header_contract.py')
          contract = contract_path.read_text()
          old_required = '    "@keyframes jl-attached-menu-lower",\n    "animation: jl-attached-menu-lower 190ms cubic-bezier(0.2, 0.8, 0.2, 1) both;",\n'
          new_required = '    "@keyframes jl-attached-menu-reveal",\n    "animation: jl-attached-menu-reveal 190ms cubic-bezier(0.2, 0.8, 0.2, 1) both;",\n    "clip-path: inset(0 0 100% 0);",\n    "clip-path: inset(0);",\n    "z-index: calc(var(--jl-z-menu) + 1);",\n'
          if old_required not in contract:
              raise SystemExit('Expected animation contract was not found')
          contract = contract.replace(old_required, new_required, 1)
          forbidden_anchor = '    "grid-column: 1 / 3;",\n'
          if forbidden_anchor not in contract:
              raise SystemExit('Expected forbidden-fragment anchor was not found')
          contract = contract.replace(forbidden_anchor, forbidden_anchor + '    "transform: translateY(-7px) scaleY(0.97);",\n', 1)
          contract_path.write_text(contract)
          PY

      - name: Validate shared header contract
        run: python3 scripts/validate_header_contract.py

      - name: Install Chromium renderer
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Create visual fixture
        run: |
          cat > visual-fixture.html <<'HTML'
          <!doctype html>
          <html lang="en" data-theme="light">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" href="/styles/index.css">
            <style>
              body { margin: 0; min-height: 100vh; background: var(--jl-color-canvas); }
              main { min-height: 520px; padding: 80px 24px; background-image: radial-gradient(var(--jl-color-canvas-dot) 1px, transparent 1px); background-size: 16px 16px; }
            </style>
          </head>
          <body>
            <header class="jl-global-header">
              <div class="jl-global-header__inner">
                <div class="jl-site-identity"><span class="jl-site-identity__owner">Johnny Li</span><span class="jl-site-identity__separator">/</span><span class="jl-site-identity__product">Portfolio</span></div>
                <nav class="jl-global-header__nav"><a href="#">Projects</a><a href="#">About</a></nav>
                <div class="jl-global-header__actions">
                  <div class="jl-site-switcher" id="fixture-switcher">
                    <button class="jl-site-switcher__button" type="button" data-site-switcher-button aria-expanded="false" aria-controls="fixture-sites">Sites <span class="jl-site-switcher__chevron" aria-hidden="true"></span></button>
                    <ul class="jl-site-menu" id="fixture-sites" data-site-switcher-menu hidden></ul>
                  </div>
                </div>
              </div>
            </header>
            <main></main>
            <script type="module">
              import { installSiteSwitcher } from '/scripts/site-controls.js';
              installSiteSwitcher(document.querySelector('#fixture-switcher'), { populate: true, currentSite: 'portfolio' });
            </script>
          </body>
          </html>
          HTML

          cat > render-menu-visual.mjs <<'JS'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 320, height: 600 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/visual-fixture.html');
          await page.waitForSelector('[data-site-switcher-button]');
          await mkdir('visual-artifacts', { recursive: true });

          async function captureSequence(kind, selector) {
            await page.click(selector);
            for (const [label, delay] of [['000', 0], ['025', 25], ['065', 40], ['125', 60], ['210', 85]]) {
              if (delay) await page.waitForTimeout(delay);
              await page.screenshot({ path: `visual-artifacts/${kind}-${label}.png` });
            }
          }

          await captureSequence('sites', '[data-site-switcher-button]');
          await page.click('[data-site-switcher-button]');
          await page.waitForTimeout(20);
          await captureSequence('settings', '[data-settings-button]');
          await browser.close();
          JS

      - name: Render animation frames
        run: |
          python3 -m http.server 4173 >/tmp/jl-visual-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node render-menu-visual.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: attached-menu-clip-reveal-frames
          path: visual-artifacts/*.png
          if-no-files-found: error

      - name: Commit only tested shared changes
        run: |
          git restore package.json package-lock.json 2>/dev/null || true
          rm -rf node_modules visual-artifacts visual-fixture.html render-menu-visual.mjs
          rm .github/workflows/one-time-clip-reveal-visual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/site-identity.css scripts/validate_header_contract.py .github/workflows/one-time-clip-reveal-visual.yml
          git commit -m "Reveal attached menus downward without overlap"
          git push origin HEAD:agent/clip-reveal-attached-menus
