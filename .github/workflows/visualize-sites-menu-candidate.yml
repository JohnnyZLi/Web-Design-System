name: Visualize Sites menu candidate

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  portfolio-render:
    if: github.head_ref == 'agent/fix-sites-menu-geometry'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wds
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JohnnyZLi/Website
          ref: main
          path: consumer
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Point Portfolio at candidate and sync
        working-directory: consumer
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sourceCommit = process.env.CANDIDATE_SHA;
          const version = JSON.parse(fs.readFileSync('../wds/version.json', 'utf8')).version;
          fs.writeFileSync('design-system.lock.json', `${JSON.stringify({ package: '@johnnyzli/web-design-system', version, sourceCommit }, null, 2)}\n`);
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          manifest.dependencies['@johnnyzli/web-design-system'] = `github:JohnnyZLi/Web-Design-System#${sourceCommit}`;
          fs.writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          npm install --no-audit --no-fund --no-package-lock
          npm run design-system:sync
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start Portfolio
        working-directory: consumer
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portfolio-candidate.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/portfolio-candidate.log
          exit 1
      - name: Render candidate at desktop, 390, and 320
        working-directory: consumer
        run: |
          mkdir -p candidate-visual
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            for (const [name, viewport] of [
              ['desktop', { width: 1440, height: 900 }],
              ['mobile', { width: 390, height: 844 }],
              ['minimum', { width: 320, height: 700 }],
            ]) {
              const context = await browser.newContext({ viewport, deviceScaleFactor: 2, reducedMotion: 'reduce' });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              const button = page.locator('.jl-site-switcher__button');
              const menu = page.locator('[data-site-switcher-menu]');
              await button.click();
              await menu.waitFor({ state: 'visible' });
              await page.screenshot({ path: `candidate-visual/sites-open-${name}.png`, fullPage: false });
              await page.locator('.jl-site-switcher').screenshot({ path: `candidate-visual/sites-control-${name}.png` });
              const metrics = await page.evaluate(() => {
                const button = document.querySelector('.jl-site-switcher__button');
                const menu = document.querySelector('[data-site-switcher-menu]');
                const links = [...document.querySelectorAll('[data-site-switcher-menu] a')];
                const rect = (el) => { const r = el.getBoundingClientRect(); return { left:r.left, right:r.right, top:r.top, bottom:r.bottom, width:r.width, height:r.height }; };
                const br = rect(button);
                const mr = rect(menu);
                return {
                  viewportWidth: innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  button: br,
                  menu: mr,
                  buttonBorderColor: getComputedStyle(button).borderTopColor,
                  links: links.map((el) => ({ text: el.textContent.trim(), rect: rect(el), scrollWidth: el.scrollWidth, clientWidth: el.clientWidth, current: el.getAttribute('aria-current') })),
                  overflow: links.some((el) => { const r = el.getBoundingClientRect(); return r.left < mr.left - .5 || r.right > mr.right + .5; }),
                };
              });
              report.push({ name, ...metrics });
              if (Math.abs(metrics.button.width - 88) > 0.75) throw new Error(`${name}: Sites trigger width ${metrics.button.width}`);
              if (Math.abs(metrics.menu.width - 144) > 0.75) throw new Error(`${name}: Sites menu width ${metrics.menu.width}`);
              if (metrics.overflow) throw new Error(`${name}: menu row escaped dropdown bounds`);
              if (metrics.links.some((link) => link.scrollWidth > link.clientWidth + 1)) throw new Error(`${name}: menu text clips`);
              if (metrics.documentWidth > metrics.viewportWidth + 1) throw new Error(`${name}: horizontal overflow ${metrics.documentWidth}/${metrics.viewportWidth}`);
              await context.close();
            }
            fs.writeFileSync('candidate-visual/report.json', JSON.stringify(report, null, 2));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sites-menu-candidate-visual
          path: consumer/candidate-visual
          retention-days: 7
