name: Visualize Sites menu candidate

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  portfolio-render:
    if: github.head_ref == 'agent/fix-sites-menu-geometry'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out design-system candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wds
          persist-credentials: false
      - name: Check out Portfolio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JohnnyZLi/Website
          ref: main
          path: consumer
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build exact candidate CSS
        working-directory: wds
        run: |
          python3 .github/scripts/patch_sites_geometry.py
          git diff --check
      - name: Inject candidate CSS and install Chromium
        run: |
          cp wds/styles/site-identity.css consumer/assets/design-system/site-identity.css
          cp wds/.github/scripts/render_sites_geometry.cjs consumer/render-sites.cjs
          cd consumer
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start Portfolio
        working-directory: consumer
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portfolio-candidate.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-candidate.log
          exit 1
      - name: Render final candidate
        working-directory: consumer
        run: node render-sites.cjs
      - name: Upload candidate render and exact CSS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sites-menu-final-candidate
          path: |
            consumer/candidate-visual
            wds/styles/site-identity.css
          retention-days: 1
