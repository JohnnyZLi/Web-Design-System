name: Visualize Sites menu candidate

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  portfolio-render:
    if: github.head_ref == 'agent/fix-sites-menu-geometry'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wds
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JohnnyZLi/Website
          ref: main
          path: consumer
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply final dropdown alignment locally
        working-directory: wds
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('styles/site-identity.css')
          s = p.read_text()
          old = '''.jl-site-menu {
  width: 144px;
  min-width: 144px;
  box-sizing: border-box;
  grid-column: 1;
  grid-row: 2;
  justify-self: start;
  padding: var(--jl-space-1);
  border-radius: 0 0 var(--jl-radius-md) var(--jl-radius-md);
  list-style: none;
}

.jl-site-menu::before {
  content: "";
  position: absolute;
  top: 0;
  right: -1px;
  left: 87px;
  border-top: 1px solid var(--jl-color-rule-strong);
}
'''
          new = '''.jl-site-menu {
  --_jl-site-menu-trigger-offset: calc(144px - 88px - var(--jl-space-2) - var(--jl-control-height-md));
  width: 144px;
  min-width: 144px;
  box-sizing: border-box;
  grid-column: 1 / 3;
  grid-row: 2;
  justify-self: end;
  padding: var(--jl-space-1);
  border-radius: 0 0 var(--jl-radius-md) var(--jl-radius-md);
  list-style: none;
}

.jl-site-menu::before,
.jl-site-menu::after {
  content: "";
  position: absolute;
  top: 0;
  border-top: 1px solid var(--jl-color-rule-strong);
}

.jl-site-menu::before {
  left: -1px;
  width: calc(var(--_jl-site-menu-trigger-offset) + 1px);
}

.jl-site-menu::after {
  right: -1px;
  left: calc(var(--_jl-site-menu-trigger-offset) + 88px);
}
'''
          if old not in s:
              raise SystemExit('expected Sites menu block not found')
          s = s.replace(old, new, 1)
          s = s.replace('''  .jl-site-menu a {
    min-height: 36px;
    padding: 6px;
  }
''', '''  .jl-site-menu {
    --_jl-site-menu-trigger-offset: calc(144px - 88px - var(--jl-space-2) - 40px);
  }

  .jl-site-menu a {
    min-height: 36px;
    padding: 6px;
  }
''', 1)
          s = s.replace('''  .jl-site-switcher__button {
    width: 88px;
    min-width: 88px;
  }

  .jl-site-menu a {
''', '''  .jl-site-switcher__button {
    width: 88px;
    min-width: 88px;
  }

  .jl-site-menu {
    --_jl-site-menu-trigger-offset: calc(144px - 88px - (var(--jl-space-1) / 2) - 40px);
  }

  .jl-site-menu a {
''', 1)
          s = s.replace('''  .jl-site-switcher {
    column-gap: 0;
  }
}
''', '''  .jl-site-switcher {
    column-gap: 0;
  }

  .jl-site-menu {
    --_jl-site-menu-trigger-offset: 16px;
  }
}
''', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Inject candidate CSS into Portfolio
        run: |
          cp wds/styles/site-identity.css consumer/assets/design-system/site-identity.css
          cd consumer
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start Portfolio
        working-directory: consumer
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portfolio-candidate.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/portfolio-candidate.log
          exit 1
      - name: Render candidate at desktop, 390, and 320
        working-directory: consumer
        run: |
          mkdir -p candidate-visual
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            for (const theme of ['light', 'dark']) {
              for (const [name, viewport] of [
                ['desktop', { width: 1440, height: 900 }],
                ['mobile', { width: 390, height: 844 }],
                ['minimum', { width: 320, height: 700 }],
              ]) {
                const context = await browser.newContext({ viewport, deviceScaleFactor: 2, colorScheme: theme, reducedMotion: 'reduce' });
                await context.addInitScript((value) => localStorage.setItem('jl-theme', value), theme);
                const page = await context.newPage();
                await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
                const button = page.locator('.jl-site-switcher__button');
                const menu = page.locator('[data-site-switcher-menu]');
                await button.click();
                await menu.waitFor({ state: 'visible' });
                await page.screenshot({ path: `candidate-visual/sites-open-${name}-${theme}.png`, fullPage: false });
                await page.locator('.jl-site-switcher').screenshot({ path: `candidate-visual/sites-control-${name}-${theme}.png` });
                const metrics = await page.evaluate(() => {
                  const button = document.querySelector('.jl-site-switcher__button');
                  const menu = document.querySelector('[data-site-switcher-menu]');
                  const links = [...document.querySelectorAll('[data-site-switcher-menu] a')];
                  const rootStyle = getComputedStyle(document.documentElement);
                  const rect = (el) => { const r = el.getBoundingClientRect(); return { left:r.left, right:r.right, top:r.top, bottom:r.bottom, width:r.width, height:r.height }; };
                  const br = rect(button);
                  const mr = rect(menu);
                  return {
                    viewportWidth: innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    button: br,
                    menu: mr,
                    buttonBorderColor: getComputedStyle(button).borderTopColor,
                    accentColor: rootStyle.getPropertyValue('--jl-color-accent').trim(),
                    links: links.map((el) => ({ text: el.textContent.trim(), rect: rect(el), scrollWidth: el.scrollWidth, clientWidth: el.clientWidth, current: el.getAttribute('aria-current') })),
                    rowOverflow: links.some((el) => { const r = el.getBoundingClientRect(); return r.left < mr.left - .5 || r.right > mr.right + .5; }),
                  };
                });
                report.push({ theme, name, ...metrics });
                if (Math.abs(metrics.button.width - 88) > 0.75) throw new Error(`${theme}/${name}: Sites trigger width ${metrics.button.width}`);
                if (Math.abs(metrics.menu.width - 144) > 0.75) throw new Error(`${theme}/${name}: Sites menu width ${metrics.menu.width}`);
                if (metrics.menu.left < -0.5 || metrics.menu.right > metrics.viewportWidth + 0.5) throw new Error(`${theme}/${name}: menu outside viewport ${metrics.menu.left}/${metrics.menu.right}`);
                if (metrics.rowOverflow) throw new Error(`${theme}/${name}: menu row escaped dropdown bounds`);
                if (metrics.links.some((link) => link.scrollWidth > link.clientWidth + 1)) throw new Error(`${theme}/${name}: menu text clips`);
                if (metrics.documentWidth > metrics.viewportWidth + 1) throw new Error(`${theme}/${name}: horizontal overflow ${metrics.documentWidth}/${metrics.viewportWidth}`);
                if (metrics.buttonBorderColor === metrics.accentColor) throw new Error(`${theme}/${name}: expanded pointer hover still uses accent border`);
                await context.close();
              }
            }
            fs.writeFileSync('candidate-visual/report.json', JSON.stringify(report, null, 2));
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sites-menu-candidate-visual
          path: |
            consumer/candidate-visual
            wds/styles/site-identity.css
          retention-days: 1
