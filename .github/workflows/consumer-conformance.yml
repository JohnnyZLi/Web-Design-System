name: Consumer design-system conformance

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the consumer.
        required: true
        type: string
      timeout-minutes:
        description: Maximum conformance time.
        required: false
        default: 20
        type: number
      install-command:
        description: Consumer dependency installation command.
        required: true
        type: string
      conformance-command:
        description: Consumer-owned command that runs integration, rendered-state, and conformance checks.
        required: true
        type: string
      artifact-name:
        description: Name of the uploaded conformance artifact.
        required: true
        type: string

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install consumer dependencies
        run: ${{ inputs.install-command }}
      - name: Run design-system conformance
        run: ${{ inputs.conformance-command }}
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-name }}
          path: design-system-conformance
          if-no-files-found: error
          retention-days: 14
