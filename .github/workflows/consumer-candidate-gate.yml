name: Consumer candidate gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      rolepacket-ref:
        description: RolePacket ref used while validating an adoption branch before it reaches main.
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: consumer-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out design-system candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          path: wds
      - name: Check out portfolio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JohnnyZLi/Website
          ref: main
          persist-credentials: false
          path: consumer
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Point portfolio at candidate
        working-directory: consumer
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('../wds/version.json', 'utf8')).version;
          const sourceCommit = process.env.CANDIDATE_SHA;
          fs.writeFileSync('design-system.lock.json', `${JSON.stringify({ package: '@johnnyzli/web-design-system', version, sourceCommit }, null, 2)}\n`);
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          manifest.dependencies['@johnnyzli/web-design-system'] = `github:JohnnyZLi/Web-Design-System#${sourceCommit}`;
          fs.writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Validate portfolio consumer
        working-directory: consumer
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run design-system:sync
          npm run design-system:integration
          npm run design-system:conformance
          npm run lint:html
          npm run lint:css

  network:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out design-system candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          path: wds
      - name: Check out Network Diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JohnnyZLi/Network-Diagnostics-Suite
          ref: main
          persist-credentials: false
          path: consumer
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Point Network Diagnostics at candidate
        working-directory: consumer
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('../wds/version.json', 'utf8')).version;
          const sourceCommit = process.env.CANDIDATE_SHA;
          fs.writeFileSync('design-system.lock.json', `${JSON.stringify({ package: '@johnnyzli/web-design-system', version, sourceCommit }, null, 2)}\n`);
          fs.writeFileSync('src/design-system/SOURCE.md', [
            '# Generated design-system assets',
            '',
            'Do not edit these files directly.',
            '',
            'Package: @johnnyzli/web-design-system',
            `Version: ${version}`,
            `Source commit: ${sourceCommit}`,
            '',
            'Validate with `npm run design-system:check`.',
            '',
          ].join('\n'));
          NODE
      - name: Validate Network Diagnostics consumer
        working-directory: consumer
        run: |
          npm ci --no-audit --no-fund
          npm run design-system:sync
          npm run design-system:integration
          npm run design-system:conformance
          npm test
          npm run build

  rolepacket:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ROLEPACKET_REF: ${{ inputs['rolepacket-ref'] || 'main' }}
      ROLEPACKET_REPOSITORY_TOKEN: ${{ secrets.ROLEPACKET_REPOSITORY_TOKEN }}
    steps:
      - name: Require private-consumer access
        id: access
        shell: bash
        run: |
          if [[ -z "$ROLEPACKET_REPOSITORY_TOKEN" ]]; then
            echo "::error::ROLEPACKET_REPOSITORY_TOKEN is required. The shared release gate must not pass without validating RolePacket."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Check out design-system candidate
        if: steps.access.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          path: wds
      - name: Check out RolePacket
        if: steps.access.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JohnnyZLi/RolePacket
          ref: ${{ env.ROLEPACKET_REF }}
          token: ${{ secrets.ROLEPACKET_REPOSITORY_TOKEN }}
          persist-credentials: false
          path: consumer
      - name: Set up Node.js
        if: steps.access.outputs.available == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Point RolePacket at candidate
        if: steps.access.outputs.available == 'true'
        working-directory: consumer
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('../wds/version.json', 'utf8')).version;
          const sourceCommit = process.env.CANDIDATE_SHA;
          fs.writeFileSync('design-system.lock.json', `${JSON.stringify({ package: '@johnnyzli/web-design-system', version, sourceCommit }, null, 2)}\n`);
          fs.writeFileSync('src/client/design-system/SOURCE.md', [
            '# Generated design-system assets',
            '',
            'Do not edit these files directly.',
            '',
            'Package: @johnnyzli/web-design-system',
            `Version: ${version}`,
            `Source commit: ${sourceCommit}`,
            '',
            'Validate with `npm run design-system:check`.',
            '',
          ].join('\n'));
          NODE
      - name: Validate RolePacket consumer
        if: steps.access.outputs.available == 'true'
        working-directory: consumer
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run design-system:sync
          npm run design-system:integration
          npm run design-system:conformance
          npm run typecheck
          npm run build
          npm run cloud:deploy:dry:built
          npm run test:unit
          npm run test:server
          npm run test:browser
          npm audit --omit=dev --audit-level=high
