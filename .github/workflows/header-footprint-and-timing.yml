name: Header footprint and timing

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/header-footprint-and-timing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - name: Lock header footprint and slow exit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          controls = Path('scripts/site-controls.js')
          text = controls.read_text()
          old = '''  const clearExit = () => {
    if (timer !== null && window) window.clearTimeout(timer);
    timer = null;
    if (animationEndHandler && inner instanceof HTMLElement) inner.removeEventListener("animationend", animationEndHandler);
    animationEndHandler = null;
    if (header instanceof HTMLElement) {
      header.removeAttribute("data-jl-header-disclosure-exit");
      header.style.removeProperty("--_jl-header-disclosure-exit-y");
    }
  };

  const cancel = () => { sequence += 1; clearExit(); };
'''
          new = '''  const clearAnimation = () => {
    if (timer !== null && window) window.clearTimeout(timer);
    timer = null;
    if (animationEndHandler && inner instanceof HTMLElement) inner.removeEventListener("animationend", animationEndHandler);
    animationEndHandler = null;
    if (header instanceof HTMLElement) {
      header.removeAttribute("data-jl-header-disclosure-exit");
      header.style.removeProperty("--_jl-header-disclosure-exit-y");
    }
  };

  const clearFootprint = () => {
    if (!(header instanceof HTMLElement)) return;
    header.removeAttribute("data-jl-header-disclosure-lock");
    header.style.removeProperty("--_jl-header-disclosure-footprint");
  };

  const clearAll = () => {
    clearAnimation();
    clearFootprint();
  };

  const prepareOpen = () => {
    sequence += 1;
    clearAnimation();
    if (!(header instanceof HTMLElement)) return;
    const height = header.getBoundingClientRect().height;
    if (height > 0) header.style.setProperty("--_jl-header-disclosure-footprint", `${height}px`);
    header.setAttribute("data-jl-header-disclosure-lock", "");
  };
'''
          if old not in text:
              raise SystemExit('header clear/cancel block did not match expected source')
          text = text.replace(old, new)
          text = text.replace('''    if (!(header instanceof HTMLElement) || !(inner instanceof HTMLElement) || !window || hasOpenDisclosure()) { clearExit(); return; }''', '''    if (!(header instanceof HTMLElement) || !(inner instanceof HTMLElement) || !window || hasOpenDisclosure()) { clearAll(); return; }''')
          text = text.replace('''    if (distance < 1) { clearExit(); return; }''', '''    if (distance < 1) { clearAll(); return; }''')
          text = text.replace('''    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { queueMicrotask(clearExit); return; }''', '''    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { queueMicrotask(clearAll); return; }''')
          text = text.replace('''      clearExit();
    };''', '''      clearAll();
    };''', 1)
          text = text.replace('''    timer = window.setTimeout(() => { if (currentSequence === sequence) clearExit(); }, 420);''', '''    timer = window.setTimeout(() => { if (currentSequence === sequence) clearAll(); }, 650);''')
          text = text.replace('''  const sync = (open) => {
    if (open) { cancel(); return; }''', '''  const sync = (open) => {
    if (open) {
      if (header instanceof HTMLElement && !header.hasAttribute("data-jl-header-disclosure-lock")) prepareOpen();
      return;
    }''')
          text = text.replace('''      if (hasOpenDisclosure()) { clearExit(); return; }''', '''      if (hasOpenDisclosure()) return;''')
          text = text.replace('''  return { cancel, sync, destroy: cancel };''', '''  return { prepareOpen, sync, destroy: clearAll };''')
          text = text.replace('headerExit.cancel();', 'headerExit.prepareOpen();')
          controls.write_text(text)

          css = Path('styles/theme-control.css')
          text = css.read_text()
          old_comment = '''/* Keep the complete top bar together while Sites or Settings is open. The
   outer header stays in flow so opening a disclosure never causes a layout
   jump; its inner bar and background are what become viewport-fixed. */'''
          new_comment = '''/* Keep the complete top bar together while Sites or Settings is open. The
   outer header stays in flow and its exact pre-open footprint is locked so
   disclosure state changes cannot move the page below it. */
:is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-lock] {
  box-sizing: border-box;
  height: var(--_jl-header-disclosure-footprint);
  min-height: var(--_jl-header-disclosure-footprint);
  max-height: var(--_jl-header-disclosure-footprint);
}'''
          if old_comment not in text:
              raise SystemExit('theme header comment did not match expected source')
          text = text.replace(old_comment, new_comment)
          old_bg = '''  height: var(--jl-layout-header-height);
  border-bottom: 1px solid var(--jl-color-rule);'''
          new_bg = '''  box-sizing: border-box;
  height: var(--_jl-header-disclosure-footprint, calc(var(--jl-layout-header-height) + 1px));
  border-bottom: 1px solid var(--jl-color-rule);'''
          if old_bg not in text:
              raise SystemExit('fixed header background height did not match expected source')
          text = text.replace(old_bg, new_bg)
          text = text.replace('animation: jl-header-disclosure-exit 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;', 'animation: jl-header-disclosure-exit 500ms cubic-bezier(0.2, 0.8, 0.2, 1) both;')
          old_mobile = '''    height: 68px;
  }
}'''
          new_mobile = '''    height: var(--_jl-header-disclosure-footprint, 69px);
  }
}'''
          idx = text.rfind(old_mobile)
          if idx < 0:
              raise SystemExit('mobile pinned header height did not match expected source')
          text = text[:idx] + text[idx:].replace(old_mobile, new_mobile, 1)
          css.write_text(text)

          contract = Path('scripts/validate_header_contract.py')
          text = contract.read_text()
          text = text.replace('"height: var(--jl-layout-header-height);",', '"height: var(--_jl-header-disclosure-footprint, calc(var(--jl-layout-header-height) + 1px));",')
          text = text.replace('"animation: jl-header-disclosure-exit 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;",', '"animation: jl-header-disclosure-exit 500ms cubic-bezier(0.2, 0.8, 0.2, 1) both;",')
          text = text.replace('''    "[data-jl-header-disclosure-exit]",
    "--_jl-header-disclosure-exit-y",''', '''    "[data-jl-header-disclosure-exit]",
    "[data-jl-header-disclosure-lock]",
    "--_jl-header-disclosure-exit-y",
    "--_jl-header-disclosure-footprint",''')
          text = text.replace('''    "function installHeaderDisclosureExit",
    "data-jl-header-disclosure-exit",''', '''    "function installHeaderDisclosureExit",
    "data-jl-header-disclosure-exit",
    "data-jl-header-disclosure-lock",
    "--_jl-header-disclosure-footprint",
    "headerExit.prepareOpen()",''')
          contract.write_text(text)
          PY
          node --check scripts/site-controls.js
          make validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/theme-control.css scripts/site-controls.js scripts/validate_header_contract.py
          git commit -m "Lock disclosure header footprint and slow exit"
          git push
