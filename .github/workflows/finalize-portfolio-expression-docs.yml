name: Finalize portfolio expression docs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'agent/finalize-portfolio-expression-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconcile canonical documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          design_path = Path('docs/DESIGN-SYSTEM.md')
          design = design_path.read_text()
          design = replace_once(
              design,
              '**Documentation revision:** 2026-08-08',
              '**Documentation revision:** 2026-08-09',
              'design revision',
          )
          design = replace_once(
              design,
              '- Global-header geometry and owner/product identity lockup',
              '- Global-header control geometry, default rail, and owner/product identity lockup',
              'shared header ownership',
          )
          design = replace_once(
              design,
              '- Portfolio narrative structure, case-study content, and editorial motion',
              '- Portfolio narrative structure, case-study content, editorial motion, and approved product-specific header rail adapter',
              'portfolio ownership',
          )
          design = replace_once(
              design,
              '- Shared inner rail and gutters',
              '- Shared default inner rail and gutters; an approved product rail adapter MAY vary desktop edge alignment without changing shared control geometry or interaction behavior',
              'shared rail bullet',
          )
          design = replace_once(
              design,
              'At 900px and below, applicable product navigation becomes the shared compact menu shell.',
              '''### Header rail expressions\n\nThe package default remains the shared centered inner rail used by Network Diagnostics and RolePacket. A product MAY use a documented rail adapter when the product composition benefits from different desktop edge alignment, provided the shared header remains recognizably and behaviorally the same component.\n\nThe approved Portfolio adapter applies at 1024px and above:\n\n- The header inner rail spans the viewport while the page content shell remains unchanged.\n- Owner/product identity is anchored 40px from the left viewport edge.\n- Sites and Settings are anchored 20px from the right viewport edge.\n- Contextual navigation remains optically centered on the viewport despite the asymmetric edge insets.\n- Below 1024px the Portfolio returns to the shared package rail and compact transformations.\n\nA rail adapter MUST NOT change Sites or Settings dimensions, disclosure shells, owned-site content, theme controls, pinned-header footprint, keyboard/focus/dismissal semantics, reduced-motion behavior, or the synchronized shared assets. It is a product-owned composition adapter, not a fork of the global-header component.\n\nAt 900px and below, applicable product navigation becomes the shared compact menu shell.''',
              'header rail expressions',
          )
          design = replace_once(
              design,
              '''Preserve editorial composition, spacing, terracotta hierarchy, source-authored homepage and case-study emphasis, narrative sections, evidence, limitations, actions, next-project navigation, and the inverse contact section. The portfolio uses the shared header, Sites/Settings controllers, compact product menu, shared appearance contract, and selected action/button primitives. It has no matching native confirmation dialog and therefore does not adopt the shared dialog shell.\n\n#### Portfolio case-study contract''',
              '''Preserve editorial composition, spacing, terracotta hierarchy, source-authored homepage and case-study emphasis, narrative sections, evidence, limitations, actions, next-project navigation, and the inverse contact section. The portfolio uses the shared header, Sites/Settings controllers, compact product menu, shared appearance contract, and selected action/button primitives. Its approved wide-desktop header rail is the product-owned adapter documented in Section 7. It has no matching native confirmation dialog and therefore does not adopt the shared dialog shell.\n\n#### Portfolio homepage expression\n\nThe homepage prioritizes a small number of strong editorial signals rather than maximizing visible UI or animation:\n\n- The hero keeps its sans/serif composition and uses primary terracotta on the source-authored emphasis words `systems` and `rely on.` while surrounding text remains the dominant neutral.\n- The About statement is the concise three-part line `hardware, software, and people`, with those three concepts carrying the terracotta editorial emphasis.\n- Working Knowledge exposes exactly three high-signal groups: `Networking & infrastructure`, `Software & platform engineering`, and the quieter full-width `Cloud, automation & delivery` band.\n- The native `details`/`summary` More Skills disclosure adds exactly three deeper groups: `Protocol internals & network analysis`, `Tooling & validation`, and `Systems & endpoint operations`. The disclosure remains visually secondary and editorial rather than becoming another dashboard or resume grid.\n- Working Knowledge SHOULD optimize for signal and composition instead of forcing every skill into mutually exclusive taxonomy. Deeper or lower-signal evidence belongs in More Skills or the relevant experience/case-study content.\n- Homepage and case-study reveal motion remains product-owned, dependency-free CSS/JavaScript with reduced-motion support. A new motion library SHOULD NOT be added for ornament alone; it requires a concrete interaction need, measured benefit, and an ownership/performance rationale.\n\n#### Portfolio case-study contract''',
              'portfolio homepage expression',
          )
          design_path.write_text(design)

          migration_path = Path('docs/MIGRATION.md')
          migration = migration_path.read_text()
          migration = replace_once(
              migration,
              '| Website | v1.9.0 | Lock, generated assets, shared dark theme, Sites/Settings disclosures, complete-header pinning, source metadata, reusable workflows, integration validation, conformance, visual audit, quality checks, security scan, CodeQL, performance baseline, and manual accessibility review are aligned. |',
              '| Website | v1.9.0 | Lock, generated assets, shared dark theme, Sites/Settings disclosures, complete-header pinning, approved wide-desktop rail adapter, source metadata, reusable workflows, integration validation, conformance, visual audit, quality checks, security scan, CodeQL, and performance baseline are aligned. The 2026-07-29 manual accessibility/zoom review remains the historical manual baseline. |',
              'website rollout row',
          )
          migration = replace_once(
              migration,
              'The original shared-system migration was accepted on 2026-07-29 after automated validation and repository-owner manual review. The v1.9.0 appearance and header extension was completed and reconciled with the canonical documentation on 2026-08-08. Package status is **approved**.',
              'The original shared-system migration was accepted on 2026-07-29 after automated validation and repository-owner manual review. The v1.9.0 appearance and header extension was completed and reconciled with the canonical documentation on 2026-08-08. The final Portfolio product expression, including its product-owned wide-desktop header rail, was recorded on 2026-08-09 without changing the shared runtime package. Package status is **approved**.',
              'migration history',
          )
          migration = replace_once(
              migration,
              '- Shared global-header geometry and owner/product identity',
              '- Shared global-header control geometry, default rail, owner/product identity, and the documented boundary for approved product rail adapters',
              'shared capability rail',
          )
          migration = replace_once(
              migration,
              '- All three consumers currently pin the same reviewed v1.9.0 shared-asset source.',
              '- All three consumers currently pin the same reviewed v1.9.0 shared-asset source.\n- Network Diagnostics and RolePacket use the default shared header rail; Portfolio uses the documented 1024px-and-up product adapter with 40px left identity inset, 20px right controls inset, and optically centered navigation.',
              'header acceptance rail',
          )
          migration = replace_once(
              migration,
              'Meaningful navigation, layout, or interaction changes after those acceptance runs still require the applicable manual checks to be re-run rather than inheriting approval automatically.',
              'Meaningful navigation, layout, or interaction changes after those acceptance runs still require the applicable manual checks to be re-run rather than inheriting approval automatically. The Portfolio desktop header rail changed on 2026-08-09 and passed the repository automated visual, theme, conformance, quality, security, CodeQL, and performance checks; its 2026-07-29 actual-zoom and assistive-technology review remains historical until that manual review is refreshed.',
              'manual acceptance freshness',
          )
          migration = replace_once(
              migration,
              '- Keep canonical documentation synchronized with the shipped header and appearance contract whenever shared behavior changes.\n- Register every future exception explicitly instead of allowing undocumented drift.',
              '- Keep canonical documentation synchronized with the shipped header and appearance contract whenever shared behavior changes.\n- Keep approved product rail adapters documented and bounded so they cannot silently fork shared controls or interaction behavior.\n- Documentation-only governance changes do not require consumer repins when packaged shared assets remain byte-identical.\n- Register every future exception explicitly instead of allowing undocumented drift.',
              'ongoing maintenance',
          )
          migration_path.write_text(migration)
          PY

          rm .github/workflows/finalize-portfolio-expression-docs.yml

      - name: Commit reconciled docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DESIGN-SYSTEM.md docs/MIGRATION.md .github/workflows/finalize-portfolio-expression-docs.yml
          git commit -m "Document final portfolio expression"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
