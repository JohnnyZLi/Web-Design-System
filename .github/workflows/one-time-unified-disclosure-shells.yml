name: One-time unified disclosure shells

on:
  push:
    branches:
      - agent/unified-expanding-header-shells

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/unified-expanding-header-shells
          fetch-depth: 0

      - name: Build unified disclosure shells
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          css_path = Path('styles/site-identity.css')
          css = css_path.read_text()

          css = replace_once(
              css,
              '  grid-template-rows: var(--jl-control-height-md) auto;\n',
              '  grid-template-rows: var(--jl-control-height-md);\n',
              'desktop switcher row',
          )

          shell_css = '''\n.jl-site-disclosure,\n.jl-settings-disclosure {\n  --_jl-disclosure-trigger-height: var(--jl-control-height-md);\n  position: relative;\n  align-self: start;\n  display: grid;\n  grid-template-rows: var(--_jl-disclosure-trigger-height) auto;\n  max-height: var(--_jl-disclosure-trigger-height);\n  box-sizing: border-box;\n  overflow: hidden;\n  border-radius: var(--jl-radius-md);\n  background: var(--jl-color-surface);\n  box-shadow: inset 0 0 0 1px var(--jl-color-rule-strong);\n}\n\n.jl-site-disclosure {\n  width: 104px;\n  grid-column: 1;\n  grid-row: 1;\n}\n\n.jl-settings-disclosure {\n  width: var(--jl-control-height-md);\n  grid-column: 2;\n  grid-row: 1;\n}\n\n.jl-site-disclosure:has(> .jl-site-switcher__button[aria-expanded="true"]),\n.jl-settings-disclosure:has(> .jl-settings-button[aria-expanded="true"]) {\n  z-index: var(--jl-z-menu);\n  max-height: 190px;\n}\n\n.jl-site-disclosure:has(> .jl-site-switcher__button:hover:not([aria-expanded="true"])),\n.jl-settings-disclosure:has(> .jl-settings-button:hover:not([aria-expanded="true"])) {\n  box-shadow: inset 0 0 0 1px var(--jl-color-accent);\n}\n\n.jl-site-disclosure:has(> .jl-site-switcher__button:focus-visible),\n.jl-settings-disclosure:has(> .jl-settings-button:focus-visible) {\n  box-shadow: inset 0 0 0 2px var(--jl-color-focus-ring);\n}\n'''
          css = replace_once(
              css,
              '\n.jl-site-switcher__button {\n',
              shell_css + '\n.jl-site-switcher__button {\n',
              'shell insertion',
          )

          old_open = '''.jl-site-switcher__button:hover,\n.jl-settings-button:hover {\n  border-color: var(--jl-color-accent);\n}\n\n.jl-site-switcher__button[aria-expanded="true"]:hover,\n.jl-settings-button[aria-expanded="true"]:hover {\n  border-color: var(--jl-color-rule-strong);\n}\n\n.jl-site-switcher__button[aria-expanded="true"] {\n  position: relative;\n  z-index: calc(var(--jl-z-menu) + 1);\n}\n'''
          new_open = '''.jl-site-switcher__button:hover,\n.jl-settings-button:hover {\n  border-color: var(--jl-color-accent);\n}\n\n.jl-site-disclosure > .jl-site-switcher__button,\n.jl-settings-disclosure > .jl-settings-button {\n  width: 100%;\n  min-width: 0;\n  height: var(--_jl-disclosure-trigger-height);\n  min-height: var(--_jl-disclosure-trigger-height);\n  grid-column: 1;\n  grid-row: 1;\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n}\n'''
          css = replace_once(css, old_open, new_open, 'open trigger treatment')

          old_settings_open = '''.jl-settings-button[aria-expanded="true"] {\n  position: relative;\n  z-index: calc(var(--jl-z-menu) + 1);\n}\n\n.jl-site-switcher__button[aria-expanded="true"]:focus,\n.jl-settings-button[aria-expanded="true"]:focus {\n  outline: none;\n  outline-offset: 0;\n  box-shadow: inset 0 0 0 2px var(--jl-color-focus-ring);\n}\n'''
          new_settings_open = '''.jl-site-disclosure > .jl-site-switcher__button:focus,\n.jl-settings-disclosure > .jl-settings-button:focus {\n  outline: none;\n  outline-offset: 0;\n  box-shadow: none;\n}\n'''
          css = replace_once(css, old_settings_open, new_settings_open, 'settings open treatment')

          old_menu = '''.jl-site-menu,\n.jl-settings-menu {\n  position: relative;\n  z-index: var(--jl-z-menu);\n  display: grid;\n  gap: calc(var(--jl-space-1) / 2);\n  margin: -2px 0 0;\n  border: 1px solid var(--jl-color-rule-strong);\n  border-top: 0;\n  background: var(--jl-color-surface);\n  box-shadow: none;\n  font-family: var(--jl-font-ui);\n  font-size: var(--jl-type-metadata-size);\n}\n\n.jl-site-menu {\n  width: 104px;\n  min-width: 104px;\n  box-sizing: border-box;\n  grid-column: 1;\n  grid-row: 2;\n  justify-self: stretch;\n  padding: var(--jl-space-1);\n  border-radius: 0 0 var(--jl-radius-md) var(--jl-radius-md);\n  list-style: none;\n}\n\n.jl-settings-menu {\n  width: var(--jl-control-height-md);\n  box-sizing: border-box;\n  grid-column: 2;\n  grid-row: 2;\n  justify-self: stretch;\n  padding: 0;\n  border-radius: 0 0 var(--jl-radius-md) var(--jl-radius-md);\n}\n'''
          new_menu = '''.jl-site-menu,\n.jl-settings-menu {\n  position: relative;\n  display: grid;\n  gap: calc(var(--jl-space-1) / 2);\n  margin: 0;\n  border: 0;\n  background: transparent;\n  box-shadow: none;\n  font-family: var(--jl-font-ui);\n  font-size: var(--jl-type-metadata-size);\n}\n\n.jl-site-menu {\n  width: 104px;\n  min-width: 104px;\n  box-sizing: border-box;\n  padding: var(--jl-space-1);\n  list-style: none;\n}\n\n.jl-settings-menu {\n  width: var(--jl-control-height-md);\n  box-sizing: border-box;\n  padding: 0;\n}\n\n.jl-site-disclosure > .jl-site-menu,\n.jl-settings-disclosure > .jl-settings-menu {\n  width: 100%;\n  min-width: 0;\n  grid-column: 1;\n  grid-row: 2;\n  justify-self: stretch;\n}\n'''
          css = replace_once(css, old_menu, new_menu, 'menu chrome')

          old_motion = '''@media (prefers-reduced-motion: no-preference) {\n  .jl-site-menu:not([hidden]),\n  .jl-settings-menu:not([hidden]) {\n    animation: jl-attached-menu-reveal 190ms cubic-bezier(0.2, 0.8, 0.2, 1) both;\n  }\n}\n'''
          new_motion = '''@media (prefers-reduced-motion: no-preference) {\n  .jl-site-disclosure,\n  .jl-settings-disclosure {\n    transition: max-height 190ms cubic-bezier(0.2, 0.8, 0.2, 1),\n      box-shadow 120ms ease;\n  }\n\n  .jl-site-menu:not([hidden]),\n  .jl-settings-menu:not([hidden]) {\n    animation: jl-attached-menu-reveal 170ms 20ms cubic-bezier(0.2, 0.8, 0.2, 1) both;\n  }\n}\n'''
          css = replace_once(css, old_motion, new_motion, 'menu motion')

          css = replace_once(
              css,
              '    grid-template-rows: 40px auto;\n',
              '    grid-template-rows: 40px;\n',
              'mobile switcher row',
          )
          css = replace_once(
              css,
              '''  .jl-site-switcher__button,\n  .jl-settings-button {\n    height: 40px;\n    min-height: 40px;\n  }\n\n  .jl-settings-button,\n  .jl-settings-menu {\n    width: 40px;\n    min-width: 40px;\n  }\n''',
              '''  .jl-site-disclosure,\n  .jl-settings-disclosure {\n    --_jl-disclosure-trigger-height: 40px;\n  }\n\n  .jl-site-switcher__button,\n  .jl-settings-button {\n    height: 40px;\n    min-height: 40px;\n  }\n\n  .jl-settings-disclosure,\n  .jl-settings-button,\n  .jl-settings-menu {\n    width: 40px;\n    min-width: 40px;\n  }\n''',
              'mobile disclosure geometry',
          )
          css = replace_once(
              css,
              '''  .jl-site-switcher__button,\n  .jl-site-menu {\n    width: 96px;\n    min-width: 96px;\n  }\n''',
              '''  .jl-site-disclosure,\n  .jl-site-switcher__button,\n  .jl-site-menu {\n    width: 96px;\n    min-width: 96px;\n  }\n''',
              'narrow sites shell',
          )
          css = replace_once(
              css,
              '''  .jl-site-switcher__button,\n  .jl-settings-button,\n  .jl-site-menu,\n  .jl-settings-menu,\n''',
              '''  .jl-site-disclosure,\n  .jl-settings-disclosure,\n  .jl-site-switcher__button,\n  .jl-settings-button,\n  .jl-site-menu,\n  .jl-settings-menu,\n''',
              'forced-colors shell list',
          )
          css = replace_once(
              css,
              '''  .jl-site-switcher__button[aria-expanded="true"]:focus,\n  .jl-settings-button[aria-expanded="true"]:focus {\n    box-shadow: inset 0 0 0 2px CanvasText;\n  }\n''',
              '''  .jl-site-disclosure,\n  .jl-settings-disclosure {\n    box-shadow: inset 0 0 0 1px CanvasText;\n  }\n\n  .jl-site-disclosure:has(> .jl-site-switcher__button:focus-visible),\n  .jl-settings-disclosure:has(> .jl-settings-button:focus-visible) {\n    box-shadow: inset 0 0 0 2px CanvasText;\n  }\n''',
              'forced-colors focus',
          )
          css_path.write_text(css)

          controls_path = Path('scripts/site-controls.js')
          controls = controls_path.read_text()
          helper = '''\nfunction ensureDisclosureShell(root, button, menu, className) {\n  let shell = button.parentElement;\n  if (!(shell instanceof HTMLElement) || !shell.classList.contains(className)) {\n    shell = root.ownerDocument.createElement("div");\n    shell.className = className;\n    root.insertBefore(shell, button);\n  }\n  if (button.parentElement !== shell) shell.append(button);\n  if (menu.parentElement !== shell) shell.append(menu);\n  return shell;\n}\n'''
          controls = replace_once(
              controls,
              '\nexport function populateOwnedSites(menu, currentSite) {\n',
              helper + '\nexport function populateOwnedSites(menu, currentSite) {\n',
              'disclosure helper insertion',
          )
          controls = replace_once(
              controls,
              '''  const settings = ensureSettingsControl(root, button, menu);\n  const theme = installThemeControl(settings.menu);\n''',
              '''  const settings = ensureSettingsControl(root, button, menu);\n  ensureDisclosureShell(root, button, menu, "jl-site-disclosure");\n  ensureDisclosureShell(root, settings.button, settings.menu, "jl-settings-disclosure");\n  const theme = installThemeControl(settings.menu);\n''',
              'disclosure shell install',
          )
          controls_path.write_text(controls)

          contract_path = Path('scripts/validate_header_contract.py')
          contract = contract_path.read_text()
          contract = replace_once(
              contract,
              'css = (Path(__file__).resolve().parents[1] / "styles" / "site-identity.css").read_text(encoding="utf-8")\n',
              'root = Path(__file__).resolve().parents[1]\ncss = (root / "styles" / "site-identity.css").read_text(encoding="utf-8")\ncontrols = (root / "scripts" / "site-controls.js").read_text(encoding="utf-8")\n',
              'contract source setup',
          )
          contract = replace_once(
              contract,
              '''    "@keyframes jl-attached-menu-reveal",\n    "animation: jl-attached-menu-reveal 190ms cubic-bezier(0.2, 0.8, 0.2, 1) both;",\n    "clip-path: inset(0 0 100% 0);",\n    "clip-path: inset(0);",\n    "z-index: calc(var(--jl-z-menu) + 1);",\n    "margin: -2px 0 0;",\n''',
              '''    ".jl-site-disclosure,\\n.jl-settings-disclosure {",\n    "max-height: var(--_jl-disclosure-trigger-height);",\n    "max-height: 190px;",\n    "box-shadow: inset 0 0 0 1px var(--jl-color-rule-strong);",\n    ".jl-site-disclosure > .jl-site-switcher__button,",\n    ".jl-settings-disclosure > .jl-settings-button",\n    "@keyframes jl-attached-menu-reveal",\n    "animation: jl-attached-menu-reveal 170ms 20ms cubic-bezier(0.2, 0.8, 0.2, 1) both;",\n    "clip-path: inset(0 0 100% 0);",\n    "clip-path: inset(0);",\n''',
              'contract shell requirements',
          )
          contract = replace_once(
              contract,
              '''    "border-bottom-left-radius: 0;",\n):\n''',
              '''    "border-bottom-left-radius: 0;",\n    "margin: -2px 0 0;",\n):\n''',
              'contract forbidden underlap',
          )
          contract = replace_once(
              contract,
              '''compact_block = css.split("@media (max-width: 420px)", 1)[1].split("@media (forced-colors: active)", 1)[0]\n''',
              '''for fragment in (\n    "function ensureDisclosureShell",\n    "\\\"jl-site-disclosure\\\"",\n    "\\\"jl-settings-disclosure\\\"",\n):\n    if fragment not in controls:\n        raise SystemExit(f"Shared site controls must create unified disclosure shells: {fragment}")\n\ncompact_block = css.split("@media (max-width: 420px)", 1)[1].split("@media (forced-colors: active)", 1)[0]\n''',
              'contract control requirements',
          )
          contract_path.write_text(contract)
          PY

      - name: Validate targeted contract
        run: python3 scripts/validate_header_contract.py

      - name: Commit intended shared changes
        run: |
          git rm .github/workflows/one-time-unified-disclosure-shells.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/site-identity.css scripts/site-controls.js scripts/validate_header_contract.py
          git diff --cached --check
          git commit -m "Unify attached header disclosure shells"
          git push origin HEAD:agent/unified-expanding-header-shells
