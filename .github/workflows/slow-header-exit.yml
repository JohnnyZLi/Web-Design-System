name: Slow header exit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/slow-header-exit.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/slower-header-exit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Slow full-header dismissal
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('styles/theme-control.css'): [
                  ('animation: jl-header-disclosure-exit 180ms cubic-bezier(0.2, 0.8, 0.2, 1) both;',
                   'animation: jl-header-disclosure-exit 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;'),
              ],
              Path('scripts/site-controls.js'): [
                  ('timer = window.setTimeout(() => { if (currentSequence === sequence) clearExit(); }, 260);',
                   'timer = window.setTimeout(() => { if (currentSequence === sequence) clearExit(); }, 420);'),
              ],
              Path('scripts/validate_header_contract.py'): [
                  ('animation: jl-header-disclosure-exit 180ms cubic-bezier(0.2, 0.8, 0.2, 1) both;',
                   'animation: jl-header-disclosure-exit 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm .github/workflows/slow-header-exit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/theme-control.css scripts/site-controls.js scripts/validate_header_contract.py .github/workflows/slow-header-exit.yml
          git commit -m "Slow full-header dismissal animation"
          git push origin HEAD:${{ github.head_ref }}
