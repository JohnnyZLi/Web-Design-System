name: PR animate full-header dismissal

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/animate-full-header-dismissal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/animate-full-header-dismissal
          fetch-depth: 0
      - name: Patch shared header behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('styles/theme-control.css'); s=p.read_text()
          s=s.replace(':is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"]),\n:is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"]) {\n  z-index: var(--jl-z-menu);\n}', ':is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"]),\n:is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"]),\n:is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-exit] {\n  z-index: var(--jl-z-menu);\n}',1)
          s=s.replace(':is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"])::before,\n:is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"])::before {', ':is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"])::before,\n:is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"])::before,\n:is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-exit]::before {',1)
          old=':is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"]) .jl-global-header__inner,\n:is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"]) .jl-global-header__inner {\n  position: fixed;\n  z-index: var(--jl-z-menu);\n  top: 0;\n  right: 0;\n  left: 0;\n  margin-inline: auto;\n}'
          new=':is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"]) .jl-global-header__inner,\n:is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"]) .jl-global-header__inner,\n:is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-exit] .jl-global-header__inner {\n  position: fixed;\n  z-index: var(--jl-z-menu);\n  top: 0;\n  right: 0;\n  left: 0;\n  margin-inline: auto;\n}\n\n:is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-exit]::before,\n:is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-exit] .jl-global-header__inner {\n  animation: jl-header-disclosure-exit 180ms cubic-bezier(0.2, 0.8, 0.2, 1) both;\n}\n\n@keyframes jl-header-disclosure-exit {\n  from { top: 0; }\n  to { top: var(--_jl-header-disclosure-exit-y, calc(-1 * var(--jl-layout-header-height))); }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-exit]::before,\n  :is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-exit] .jl-global-header__inner { animation: none; }\n}'
          if old not in s: raise SystemExit('fixed header block not found')
          s=s.replace(old,new,1)
          s=s.replace(':is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"]) .jl-site-switcher,\n:is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"]) .jl-site-switcher {', ':is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"]) .jl-site-switcher,\n:is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"]) .jl-site-switcher,\n:is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-exit] .jl-site-switcher {',1)
          s=s.replace('  :is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"])::before,\n  :is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"])::before {\n    height: 68px;\n  }', '  :is(.jl-global-header, .jl-site-header):has([data-site-switcher-button][aria-expanded="true"])::before,\n  :is(.jl-global-header, .jl-site-header):has([data-settings-button][aria-expanded="true"])::before,\n  :is(.jl-global-header, .jl-site-header)[data-jl-header-disclosure-exit]::before {\n    height: 68px;\n  }',1)
          p.write_text(s)

          p=Path('scripts/site-controls.js'); s=p.read_text(); marker='export function installSiteSwitcher(root, options = {}) {'
          helper='''function installHeaderDisclosureExit(root) {\n  const header = root.closest(".jl-global-header, .jl-site-header");\n  const inner = header?.querySelector(".jl-global-header__inner");\n  const window = root.ownerDocument.defaultView;\n  let timer = null;\n  let animationEndHandler = null;\n  let sequence = 0;\n\n  const hasOpenDisclosure = () => root.querySelector(\n    '[data-site-switcher-button][aria-expanded="true"], [data-settings-button][aria-expanded="true"]',\n  ) !== null;\n\n  const clearExit = () => {\n    if (timer !== null && window) window.clearTimeout(timer);\n    timer = null;\n    if (animationEndHandler && inner instanceof HTMLElement) inner.removeEventListener("animationend", animationEndHandler);\n    animationEndHandler = null;\n    if (header instanceof HTMLElement) {\n      header.removeAttribute("data-jl-header-disclosure-exit");\n      header.style.removeProperty("--_jl-header-disclosure-exit-y");\n    }\n  };\n\n  const cancel = () => { sequence += 1; clearExit(); };\n\n  const beginExit = () => {\n    if (!(header instanceof HTMLElement) || !(inner instanceof HTMLElement) || !window || hasOpenDisclosure()) { clearExit(); return; }\n    const naturalRect = header.getBoundingClientRect();\n    const fixedRect = inner.getBoundingClientRect();\n    const distance = Math.min(fixedRect.height, Math.max(0, -naturalRect.top));\n    if (distance < 1) { clearExit(); return; }\n    header.style.setProperty("--_jl-header-disclosure-exit-y", `${-distance}px`);\n    header.setAttribute("data-jl-header-disclosure-exit", "");\n    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { queueMicrotask(clearExit); return; }\n    const currentSequence = ++sequence;\n    animationEndHandler = (event) => {\n      if (event.animationName !== "jl-header-disclosure-exit" || currentSequence !== sequence) return;\n      clearExit();\n    };\n    inner.addEventListener("animationend", animationEndHandler);\n    timer = window.setTimeout(() => { if (currentSequence === sequence) clearExit(); }, 260);\n  };\n\n  const sync = (open) => {\n    if (open) { cancel(); return; }\n    const currentSequence = ++sequence;\n    queueMicrotask(() => {\n      if (currentSequence !== sequence) return;\n      if (hasOpenDisclosure()) { clearExit(); return; }\n      beginExit();\n    });\n  };\n\n  return { cancel, sync, destroy: cancel };\n}\n\n'''
          if marker not in s: raise SystemExit('installSiteSwitcher marker missing')
          s=s.replace(marker,helper+marker,1)
          s=s.replace('  const theme = installThemeControl(settings.menu);\n  let settingsDisclosure = null;', '  const theme = installThemeControl(settings.menu);\n  const headerExit = installHeaderDisclosureExit(root);\n  let settingsDisclosure = null;',1)
          s=s.replace('    onBeforeOpen: () => {\n      settingsDisclosure?.close();\n      options.onBeforeOpen?.();\n    },\n    onOpenChange: options.onOpenChange,', '    onBeforeOpen: () => {\n      headerExit.cancel();\n      settingsDisclosure?.close();\n      options.onBeforeOpen?.();\n    },\n    onOpenChange: (open) => {\n      headerExit.sync(open);\n      options.onOpenChange?.(open);\n    },',1)
          s=s.replace('    onBeforeOpen: () => {\n      sitesDisclosure.close();\n      options.onBeforeOpen?.();\n    },\n  });', '    onBeforeOpen: () => {\n      headerExit.cancel();\n      sitesDisclosure.close();\n      options.onBeforeOpen?.();\n    },\n    onOpenChange: headerExit.sync,\n  });',1)
          s=s.replace('      settingsDisclosure.destroy();\n      theme.destroy();', '      settingsDisclosure.destroy();\n      theme.destroy();\n      headerExit.destroy();',1)
          for x in ('function installHeaderDisclosureExit','headerExit.sync(open)','onOpenChange: headerExit.sync','data-jl-header-disclosure-exit'):
            if x not in s: raise SystemExit('missing '+x)
          p.write_text(s)

          p=Path('scripts/validate_header_contract.py'); s=p.read_text()
          s=s.replace('    "height: 68px;",\n)', '    "height: 68px;",\n    "[data-jl-header-disclosure-exit]",\n    "animation: jl-header-disclosure-exit 180ms cubic-bezier(0.2, 0.8, 0.2, 1) both;",\n    "@keyframes jl-header-disclosure-exit",\n    "top: var(--_jl-header-disclosure-exit-y, calc(-1 * var(--jl-layout-header-height)));",\n)',1)
          s=s.replace('    "\\\"jl-settings-disclosure\\\"",\n):', '    "\\\"jl-settings-disclosure\\\"",\n    "function installHeaderDisclosureExit",\n    "data-jl-header-disclosure-exit",\n    "--_jl-header-disclosure-exit-y",\n    "headerExit.sync(open)",\n    "onOpenChange: headerExit.sync",\n):',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python3 scripts/validate_header_contract.py
          npm install --no-audit --no-fund
          npm test
      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/pr-animate-header-dismissal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Animate full-header dismissal"
          git push origin HEAD:agent/animate-full-header-dismissal
