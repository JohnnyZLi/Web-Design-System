name: Patch Sites lockup compatibility

on:
  push:
    branches:
      - ui/sites-button-lockup
    paths:
      - .github/workflows/patch-sites-lockup-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui/sites-button-lockup
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Preserve current consumer icon dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css_path = Path('styles/site-identity.css')
          css = css_path.read_text()
          replacements = {
              'grid-template-columns: max-content 0.85em;': 'grid-template-columns: max-content 12px;',
              '  width: 0.85em;': '  width: 12px;',
              '  height: 0.85em;': '  height: 12px;',
          }
          for old, new in replacements.items():
              if css.count(old) != 1:
                  raise SystemExit(f'Expected one CSS fragment: {old!r}; found {css.count(old)}')
              css = css.replace(old, new, 1)
          css_path.write_text(css)
          validator_path = Path('scripts/validate_header_contract.py')
          validator = validator_path.read_text()
          for old, new in {
              '    "grid-template-columns: max-content 0.85em;",': '    "grid-template-columns: max-content 12px;",',
              '    "width: 0.85em;",': '    "width: 12px;",',
              '    "height: 0.85em;",': '    "height: 12px;",',
          }.items():
              if validator.count(old) != 1:
                  raise SystemExit(f'Expected one validator fragment: {old!r}; found {validator.count(old)}')
              validator = validator.replace(old, new, 1)
          validator_path.write_text(validator)
          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          old = 'the label and em-sized SVG now form one inner grid unit'
          new = 'the label and fixed icon cell now form one inner grid unit'
          if changelog.count(old) != 1:
              raise SystemExit(f'Expected one changelog phrase, found {changelog.count(old)}')
          changelog_path.write_text(changelog.replace(old, new, 1))
          PY
      - name: Validate design system
        run: |
          node scripts/test-conformance-runner.mjs
          python scripts/validate_header_contract.py
          make validate
          npm pack --dry-run --json >/tmp/package.json
          make release
      - name: Commit compatibility adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/site-identity.css scripts/validate_header_contract.py CHANGELOG.md
          git commit -m "Preserve Sites icon dimensions during lockup migration"
          git push origin HEAD:ui/sites-button-lockup
