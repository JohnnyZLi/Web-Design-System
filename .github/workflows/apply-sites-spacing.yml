name: Apply Sites spacing

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/relax-sites-menu-spacing'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/relax-sites-menu-spacing
          fetch-depth: 0
      - name: Apply spacing patch
        run: |
          python3 .github/scripts/apply_sites_spacing.py
          python3 scripts/validate_header_contract.py
          git diff --check
      - name: Commit shared CSS and validator
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/site-identity.css scripts/validate_header_contract.py
          git commit -m "Relax Sites menu spacing"
          git push origin HEAD:agent/relax-sites-menu-spacing
