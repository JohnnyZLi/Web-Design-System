name: One-time creamier dark neutrals

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/creamier-dark-neutrals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Warm dark neutral text palette
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('tokens/tokens.tokens.json')
          data = json.loads(path.read_text())
          dark = data['theme']['dark']['color']
          updates = {
              'ink': ('#efe7db', [0.937255, 0.905882, 0.858824]),
              'text': ('#d6cec1', [0.839216, 0.807843, 0.756863]),
              'muted': ('#a79f94', [0.654902, 0.623529, 0.580392]),
              'textInverse': ('#efe7db', [0.937255, 0.905882, 0.858824]),
              'mutedInverse': ('#bfb6aa', [0.74902, 0.713725, 0.666667]),
          }
          for key, (hex_value, components) in updates.items():
              value = dark[key]['$value']
              value['hex'] = hex_value
              value['components'] = components
          path.write_text(json.dumps(data, separators=(',', ':')) + '\n')

          css = Path('tokens/tokens.css')
          text = css.read_text()
          replacements = {
              '--jl-theme-dark-color-ink: #f4f0e8;': '--jl-theme-dark-color-ink: #efe7db;',
              '--jl-theme-dark-color-text: #d9d3c9;': '--jl-theme-dark-color-text: #d6cec1;',
              '--jl-theme-dark-color-muted: #aaa399;': '--jl-theme-dark-color-muted: #a79f94;',
              '--jl-theme-dark-color-text-inverse: #f2efe8;': '--jl-theme-dark-color-text-inverse: #efe7db;',
              '--jl-theme-dark-color-muted-inverse: #c5beb3;': '--jl-theme-dark-color-muted-inverse: #bfb6aa;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected token: {old}')
              text = text.replace(old, new, 1)
          css.write_text(text)
          PY
      - name: Commit shared token change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-creamier-dark-neutrals.yml
          git add tokens/tokens.css tokens/tokens.tokens.json
          git commit -m "Warm dark neutral text palette"
          git push
