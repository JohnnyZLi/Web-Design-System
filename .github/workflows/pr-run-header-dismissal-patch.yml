name: PR run header-dismissal patch

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/animate-full-header-dismissal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/animate-full-header-dismissal
          fetch-depth: 0
      - name: Reuse implementation patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          source = Path('.github/workflows/pr-animate-header-dismissal.yml').read_text()
          body = source.split("          python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(compile(dedent(body), '<header-dismissal-patch>', 'exec'))
          PY
      - name: Validate with repository tooling
        run: |
          python3 scripts/validate_header_contract.py
          node --check scripts/site-controls.js
          make validate
      - name: Commit implementation
        run: |
          rm .github/workflows/pr-animate-header-dismissal.yml
          rm .github/workflows/pr-run-header-dismissal-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Animate full-header dismissal"
          git push origin HEAD:agent/animate-full-header-dismissal
