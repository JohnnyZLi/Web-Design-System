name: Consumer design system sync

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the consumer.
        required: true
        type: string
      timeout-minutes:
        description: Maximum validation time.
        required: false
        default: 20
        type: number
      install-command:
        description: Dependency installation command.
        required: true
        type: string
      validate-command:
        description: Consumer validation command.
        required: true
        type: string
      tracked-paths:
        description: Newline-separated paths committed by the update pull request.
        required: true
        type: string
      product-name:
        description: Human-readable product name.
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-design-system-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Resolve latest reviewed design system
        run: npm run design-system:update
      - name: Synchronize generated assets
        run: npm run design-system:sync
      - name: Validate update
        run: ${{ inputs.validate-command }}
      - name: Open or refresh update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKED_PATHS: ${{ inputs.tracked-paths }}
          PRODUCT_NAME: ${{ inputs.product-name }}
        shell: bash
        run: |
          mapfile -t tracked_paths <<< "$TRACKED_PATHS"
          if git diff --quiet -- "${tracked_paths[@]}"; then
            echo "$PRODUCT_NAME already uses the latest design system."
            exit 0
          fi

          version=$(node -p "require('./design-system.lock.json').version")
          branch=automation/design-system-update
          body="Automated synchronization of the reviewed Web Design System release and generated ${PRODUCT_NAME} assets."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- "${tracked_paths[@]}"
          git commit -m "Update Web Design System to v${version}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:${branch}"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "Update Web Design System to v${version}" --body "$body"
          else
            gh pr create --draft --base main --head "$branch" --title "Update Web Design System to v${version}" --body "$body"
          fi
