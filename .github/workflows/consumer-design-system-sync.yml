name: Consumer design system sync

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the consumer.
        required: true
        type: string
      timeout-minutes:
        description: Maximum validation time.
        required: false
        default: 20
        type: number
      install-command:
        description: Dependency installation command.
        required: true
        type: string
      validate-command:
        description: Consumer validation command.
        required: true
        type: string
      tracked-paths:
        description: Newline-separated paths committed by the update pull request.
        required: true
        type: string
      product-name:
        description: Human-readable product name.
        required: true
        type: string
      package-json:
        description: Optional package manifest to repin before install; replaces consumer-side npm run design-system:update.
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-design-system-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out release resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: .design-system-tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
      - name: Resolve latest approved design system
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_JSON_PATH: ${{ inputs.package-json }}
        shell: bash
        run: |
          args=(--lock design-system.lock.json)
          if [[ -n "$PACKAGE_JSON_PATH" ]]; then
            args+=(--package-json "$PACKAGE_JSON_PATH")
          fi
          node .design-system-tooling/scripts/resolve-reviewed-release.mjs "${args[@]}"
      - name: Remove resolver checkout
        shell: bash
        run: rm -rf .design-system-tooling
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Synchronize generated assets
        run: npm run design-system:sync
      - name: Validate update
        run: ${{ inputs.validate-command }}
      - name: Open or refresh update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKED_PATHS: ${{ inputs.tracked-paths }}
          PRODUCT_NAME: ${{ inputs.product-name }}
        shell: bash
        run: |
          mapfile -t tracked_paths <<< "$TRACKED_PATHS"
          filtered_paths=()
          for path in "${tracked_paths[@]}"; do
            [[ -n "$path" ]] && filtered_paths+=("$path")
          done
          tracked_paths=("${filtered_paths[@]}")
          if [[ ${#tracked_paths[@]} -eq 0 ]]; then
            echo "No tracked paths were configured."
            exit 1
          fi

          version=$(node -p "require('./design-system.lock.json').version")
          branch=automation/design-system-update
          body="Automated synchronization of the reviewed Web Design System release and generated ${PRODUCT_NAME} assets."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- "${tracked_paths[@]}"

          if git diff --cached --quiet; then
            echo "$PRODUCT_NAME already uses the latest design system."
            exit 0
          fi

          git commit -m "Update Web Design System to v${version}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:${branch}"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "Update Web Design System to v${version}" --body "$body"
          else
            set +e
            create_output=$(gh pr create --draft --base main --head "$branch" --title "Update Web Design System to v${version}" --body "$body" 2>&1)
            create_status=$?
            set -e
            if [[ $create_status -ne 0 ]]; then
              if grep -Fq "GitHub Actions is not permitted to create or approve pull requests" <<< "$create_output"; then
                echo "::warning title=Design-system update branch published::${PRODUCT_NAME} was synchronized and validated on ${branch}, but this repository does not allow GitHub Actions to create pull requests. Create a pull request from ${branch} to main, or enable 'Allow GitHub Actions to create and approve pull requests' in repository Actions settings."
                echo "$create_output"
                exit 0
              fi
              echo "$create_output" >&2
              exit "$create_status"
            fi
            echo "$create_output"
          fi
