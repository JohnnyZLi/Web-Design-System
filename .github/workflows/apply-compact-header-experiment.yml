name: Apply compact shared header experiment

on:
  push:
    branches:
      - ui/compact-header-utility-cluster

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui/compact-header-utility-cluster
          persist-credentials: true
      - name: Apply package-owned compact utility variant
        run: |
          python3 .github/scripts/apply_compact_header.py
          python3 scripts/validate_header_contract.py
          python3 scripts/validate_package.py
      - name: Commit package variant and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-compact-header-experiment.yml .github/scripts/apply_compact_header.py
          git add styles/site-identity.css styles/theme-control.css docs/DESIGN-SYSTEM.md CHANGELOG.md scripts/validate_header_contract.py
          git commit -m "Add compact shared header utility variant"
          git push origin HEAD:ui/compact-header-utility-cluster
