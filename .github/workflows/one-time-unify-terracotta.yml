name: One-time unify terracotta

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/unify-terracotta-across-themes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Match dark terracotta to light palette
        run: |
          python - <<'PY'
          from pathlib import Path

          json_path = Path('tokens/tokens.tokens.json')
          css_path = Path('tokens/tokens.css')

          text = json_path.read_text()
          replacements = {
              '"accent":{"$value":{"colorSpace":"srgb","components":[0.819608,0.517647,0.407843],"alpha":1.0,"hex":"#d18468"}}': '"accent":{"$value":{"colorSpace":"srgb","components":[0.623529,0.333333,0.243137],"alpha":1.0,"hex":"#9f553e"}}',
              '"accentHover":{"$value":{"colorSpace":"srgb","components":[0.862745,0.596078,0.490196],"alpha":1.0,"hex":"#dc987d"}}': '"accentHover":{"$value":{"colorSpace":"srgb","components":[0.560784,0.301961,0.223529],"alpha":1.0,"hex":"#8f4d39"}}',
              '"accentActive":{"$value":{"colorSpace":"srgb","components":[0.741176,0.411765,0.309804],"alpha":1.0,"hex":"#bd694f"}}': '"accentActive":{"$value":{"colorSpace":"srgb","components":[0.498039,0.258824,0.192157],"alpha":1.0,"hex":"#7f4231"}}',
              '"accentDecorative":{"$value":{"colorSpace":"srgb","components":[0.780392,0.466667,0.356863],"alpha":1.0,"hex":"#c7775b"}}': '"accentDecorative":{"$value":{"colorSpace":"srgb","components":[0.647059,0.364706,0.270588],"alpha":1.0,"hex":"#a55d45"}}',
              '"onAccent":{"$value":{"colorSpace":"srgb","components":[0.090196,0.090196,0.078431],"alpha":1.0,"hex":"#171714"}}': '"onAccent":{"$value":{"colorSpace":"srgb","components":[1.0,0.980392,0.956863],"alpha":1.0,"hex":"#fffaf4"}}',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one JSON match for {old[:40]!r}, found {count}')
              text = text.replace(old, new)
          json_path.write_text(text)

          css = css_path.read_text()
          css_replacements = {
              '--jl-theme-dark-color-accent: #d18468;': '--jl-theme-dark-color-accent: #9f553e;',
              '--jl-theme-dark-color-accent-hover: #dc987d;': '--jl-theme-dark-color-accent-hover: #8f4d39;',
              '--jl-theme-dark-color-accent-active: #bd694f;': '--jl-theme-dark-color-accent-active: #7f4231;',
              '--jl-theme-dark-color-accent-decorative: #c7775b;': '--jl-theme-dark-color-accent-decorative: #a55d45;',
              '--jl-theme-dark-color-on-accent: #171714;': '--jl-theme-dark-color-on-accent: #fffaf4;',
          }
          for old, new in css_replacements.items():
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one CSS match for {old!r}, found {count}')
              css = css.replace(old, new)
          css_path.write_text(css)
          PY

          grep -q -- '--jl-theme-dark-color-accent: #9f553e;' tokens/tokens.css
          grep -q -- '--jl-theme-dark-color-accent-decorative: #a55d45;' tokens/tokens.css
          grep -q -- '--jl-theme-dark-color-on-accent: #fffaf4;' tokens/tokens.css
          git diff --check
      - name: Commit shared token change
        run: |
          rm .github/workflows/one-time-unify-terracotta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tokens/tokens.tokens.json tokens/tokens.css .github/workflows/one-time-unify-terracotta.yml
          git commit -m "Use the same terracotta in light and dark themes"
          git push origin HEAD:${{ github.head_ref }}
