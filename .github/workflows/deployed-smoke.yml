name: Deployed smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: read

jobs:
  owned-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Check deployed domains
        env:
          ROLEPACKET_ACCESS_CLIENT_ID: ${{ secrets.ROLEPACKET_ACCESS_CLIENT_ID }}
          ROLEPACKET_ACCESS_CLIENT_SECRET: ${{ secrets.ROLEPACKET_ACCESS_CLIENT_SECRET }}
        run: node scripts/smoke-deployments.mjs
