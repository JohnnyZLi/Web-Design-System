name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-theme-cascade:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/shared-dark-mode' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out theme branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-dark-mode
      - name: Patch generator and foundations
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          generator = Path('scripts/design_system.py')
          text = generator.read_text()
          old = '''    lines.extend(["}", ""])
    return "\\n".join(lines)
'''
          new = '''    lines.append("}")
    dark_mappings = []
    for path, _token, _token_type in walk(data):
        if len(path) >= 4 and path[:2] == ("theme", "dark") and path[2] in {"color", "semantic"}:
            dark_mappings.append((css_name(path[2:]), css_name(path)))
    if dark_mappings:
        lines.extend(["", ':root[data-theme="dark"] {'])
        for target, source in dark_mappings:
            lines.append(f"  {target}: var({source});")
        lines.append("}")
    lines.append("")
    return "\\n".join(lines)
'''
          if old not in text:
              raise SystemExit('render_tokens patch location missing')
          generator.write_text(text.replace(old, new, 1))

          foundations = Path('styles/foundations.css')
          css = foundations.read_text()
          css, count = re.subn(
              r'  :root\[data-theme="dark"\] \{.*?\n  \}\n\n  body \{',
              '  :root[data-theme="dark"] {\n    color-scheme: dark;\n    --_jl-focus-gap-color: var(--jl-color-focus-gap-dark);\n  }\n\n  body {',
              css,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('dark foundations remap was not found')
          foundations.write_text(css)

          validator = Path('scripts/validate_package.py')
          text = validator.read_text()
          needle = 'tokens = (ROOT / "tokens" / "tokens.css").read_text(encoding="utf-8")'
          if needle in text and 'generated dark token remap' not in text:
              text = text.replace(
                  needle,
                  needle + '\n    require(tokens, (\':root[data-theme="dark"] {\', \'--jl-color-canvas: var(--jl-theme-dark-color-canvas);\'), "generated dark token remap")',
                  1,
              )
              validator.write_text(text)

          Path('.github/workflows/apply-theme-cascade-fix.yml').unlink(missing_ok=True)
          PY
          python3 scripts/design_system.py generate
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix dark theme token cascade"
          git push origin HEAD:feat/shared-dark-mode

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate Node tooling syntax
        run: |
          node --check scripts/theme-bootstrap.js
          node --check scripts/site-controls.js
          node --check scripts/conformance-runner.mjs
          node --check scripts/validate-rolepacket-candidate-local.mjs
      - name: Exercise conformance runner
        run: node scripts/test-conformance-runner.mjs
      - name: Validate extreme-compact header
        run: python scripts/validate_header_contract.py
      - name: Validate design system
        run: make validate
      - name: Verify npm package contents
        run: npm pack --dry-run --json
      - name: Build release artifacts
        run: make release
