name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate Node tooling syntax
        run: |
          node --check scripts/conformance-runner.mjs
          node --check scripts/validate-rolepacket-candidate-local.mjs
      - name: Exercise conformance runner
        run: node scripts/test-conformance-runner.mjs
      - name: Validate extreme-compact header
        run: python scripts/validate_header_contract.py
      - name: Validate design system
        run: make validate
      - name: Verify npm package contents
        run: npm pack --dry-run --json
      - name: Build release artifacts
        run: make release
