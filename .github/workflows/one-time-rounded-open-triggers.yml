name: One-time rounded open triggers

on:
  push:
    branches:
      - agent/preserve-rounded-open-triggers

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/preserve-rounded-open-triggers
          fetch-depth: 0

      - name: Preserve rounded triggers and tuck menus underneath
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('styles/site-identity.css')
          css = css_path.read_text()

          css = css.replace('''.jl-site-switcher__button[aria-expanded="true"]:hover,\n.jl-settings-button[aria-expanded="true"]:hover {\n  border-color: var(--jl-color-rule-strong);\n  border-bottom-color: transparent;\n}\n''', '''.jl-site-switcher__button[aria-expanded="true"]:hover,\n.jl-settings-button[aria-expanded="true"]:hover {\n  border-color: var(--jl-color-rule-strong);\n}\n''')

          css = css.replace('''.jl-site-switcher__button[aria-expanded="true"] {\n  position: relative;\n  z-index: calc(var(--jl-z-menu) + 1);\n  border-bottom-color: transparent;\n  border-bottom-right-radius: 0;\n  border-bottom-left-radius: 0;\n}\n''', '''.jl-site-switcher__button[aria-expanded="true"] {\n  position: relative;\n  z-index: calc(var(--jl-z-menu) + 1);\n}\n''')

          css = css.replace('''.jl-settings-button[aria-expanded="true"] {\n  position: relative;\n  z-index: calc(var(--jl-z-menu) + 1);\n  border-bottom-color: transparent;\n  border-bottom-right-radius: 0;\n  border-bottom-left-radius: 0;\n}\n''', '''.jl-settings-button[aria-expanded="true"] {\n  position: relative;\n  z-index: calc(var(--jl-z-menu) + 1);\n}\n''')

          css = css.replace('''  gap: calc(var(--jl-space-1) / 2);\n  margin: 0;\n  border: 1px solid var(--jl-color-rule-strong);\n''', '''  gap: calc(var(--jl-space-1) / 2);\n  margin: -2px 0 0;\n  border: 1px solid var(--jl-color-rule-strong);\n''', 1)

          css_path.write_text(css)

          contract_path = Path('scripts/validate_header_contract.py')
          contract = contract_path.read_text()
          contract = contract.replace(
              '    "z-index: calc(var(--jl-z-menu) + 1);",\n',
              '    "z-index: calc(var(--jl-z-menu) + 1);",\n    "margin: -2px 0 0;",\n'
          )
          contract = contract.replace(
              '    "transform: translateY(-7px) scaleY(0.97);",\n',
              '    "transform: translateY(-7px) scaleY(0.97);",\n    "border-bottom-color: transparent;",\n    "border-bottom-right-radius: 0;",\n    "border-bottom-left-radius: 0;",\n'
          )
          contract_path.write_text(contract)
          PY

      - name: Validate header contract
        run: python3 scripts/validate_header_contract.py

      - name: Commit shared change and remove one-time workflow
        run: |
          git rm .github/workflows/one-time-rounded-open-triggers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/site-identity.css scripts/validate_header_contract.py
          git commit -m "Keep open header triggers rounded"
          git push origin HEAD:agent/preserve-rounded-open-triggers
