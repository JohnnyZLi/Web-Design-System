name: Apply content-driven disclosure migration

on:
  push:
    branches:
      - agent/content-driven-header-disclosures

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-driven-header-disclosures
          fetch-depth: 0

      - name: Apply migration
        run: python3 scripts/apply_content_driven_disclosures.py

      - name: Validate shared header contract
        run: python3 scripts/validate_header_contract.py

      - name: Remove one-time migration helpers
        run: |
          rm scripts/apply_content_driven_disclosures.py
          rm .github/workflows/apply-content-driven-disclosures.yml

      - name: Commit migrated shared source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/site-identity.css scripts/validate_header_contract.py scripts/apply_content_driven_disclosures.py .github/workflows/apply-content-driven-disclosures.yml
          git commit -m "Use content-driven header disclosure height"
          git push origin HEAD:agent/content-driven-header-disclosures
