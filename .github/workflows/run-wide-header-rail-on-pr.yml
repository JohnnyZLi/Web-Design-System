name: Run wide header rail updater

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply existing one-time updater
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/apply-wide-header-rail.yml').read_text()
          start = text.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = text.index("\n          PY\n", start)
          body = text[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, '<wide-header-rail-updater>', 'exec'))
          PY
      - name: Commit transformed files
        run: |
          git config user.name "JohnnyZLi"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git rm .github/workflows/apply-wide-header-rail.yml .github/workflows/run-wide-header-rail-on-pr.yml
          git add styles/site-identity.css scripts/validate_header_contract.py docs/DESIGN-SYSTEM.md docs/MIGRATION.md CHANGELOG.md
          git commit -m "Unify wide desktop header rail"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
